version: "1.0"

thresholds:
  warn: 0.4
  block: 0.7

input_guards:
  - id: pii-detector
    enabled: true
    weight: 0.8
    options:
      redaction_strategy: mask
      entities:
        - EMAIL_ADDRESS
        - PHONE_NUMBER
        - CREDIT_CARD
        - SSN
        - IP_ADDRESS
        - DATE_OF_BIRTH
        - PERSON_NAME
        - STREET_ADDRESS

  - id: injection-scanner
    enabled: true
    weight: 1.0
    options:
      check_base64: true
      check_unicode_normalization: true

  - id: topic-classifier
    enabled: true
    weight: 0.9
    options:
      always_block:
        - WEAPONS_MASS_DESTRUCTION
        - CSAM
        - SELF_HARM_INSTRUCTIONS
      configurable_allow:
        - CODING
        - GENERAL_QA
        - CREATIVE_WRITING

  - id: token-budget
    enabled: true
    weight: 0.3
    options:
      max_input_tokens: 4096
      max_output_tokens: 2048
      conversation_budget: 32768

output_guards:
  - id: hallucination-detector
    enabled: true
    weight: 0.5

  - id: toxicity-filter
    enabled: true
    weight: 0.8
    options:
      provider: local
      categories:
        - HATE_SPEECH
        - HARASSMENT
        - PROFANITY
        - SELF_HARM
      threshold: 0.5

  - id: pii-rechecker
    enabled: true
    weight: 0.9

  - id: schema-validator
    enabled: true
    weight: 0.3
    options:
      max_length_chars: 8000
      language_match: true
      format_rules:
        mode: plain-text

audit:
  enabled: true
  level: standard
  destination: file
  file_path: ./logs/audit.jsonl

fail_mode: open
input_mode: sequential
output_mode: parallel